<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estoque • Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font:15px system-ui,sans-serif}header{background:#112746;color:white;padding:28px max(24px,calc((100vw - 1150px)/2))}header small{color:#91accb;letter-spacing:3px}h1{margin:10px 0;font-size:30px}header p{color:#bacce1}main{max-width:1150px;margin:28px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,section{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:22px}.card span{color:#66738a}.card strong{display:block;font-size:28px;margin-top:10px}.layout{display:grid;grid-template-columns:320px 1fr;gap:22px;margin-top:24px}h2{margin-top:0;font-size:19px}label{display:block;margin:16px 0 6px;color:#4c5c73}input{width:100%;border:1px solid #ccd5e0;border-radius:8px;padding:12px;font:inherit}input:focus{outline:2px solid #aac7ff}button{font:inherit;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;background:#245edb;color:white}button:disabled{opacity:.55;cursor:wait}.secondary{background:#ecf1f8;color:#24436c}.danger{color:#b62d42;background:#fff0f2}.actions{display:flex;gap:8px;margin-top:20px}.table{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:18px;white-space:nowrap}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #edf0f5}th{color:#758198;font-size:12px}td button{padding:7px 10px;margin-right:6px}.muted{color:#758198}#message{margin:18px 0;min-height:24px}#message.error{color:#ae2438}.tag{border-radius:20px;background:#eef3fb;padding:5px 10px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{gap:8px}.card{padding:14px}.card strong{font-size:21px}header{padding:24px}.card span{font-size:12px}}
</style>
<header><small>GESTÃO DE ESTOQUE</small><h1>Deploy automático funcionando!</h1><p>Cadastre, acompanhe e atualize seu estoque em um só lugar.</p></header>
<main><div class="stats"><div class="card"><span>Produtos cadastrados</span><strong id="total">0</strong></div><div class="card"><span>Unidades em estoque</span><strong id="units">0</strong></div><div class="card"><span>Valor do estoque</span><strong id="value">R$ 0,00</strong></div></div><div id="message" role="status" aria-live="polite"></div><div class="layout"><section><h2 id="formTitle">Novo produto</h2><form id="form"><label for="nome">Nome do produto</label><input id="nome" required maxlength="120" placeholder="Ex.: Teclado sem fio"><label for="categoria">Categoria</label><input id="categoria" maxlength="80" placeholder="Ex.: Informática"><label for="preco">Preço unitário (R$)</label><input id="preco" type="number" min="0" max="100000000" step="0.01" required><label for="quantidade">Quantidade</label><input id="quantidade" type="number" min="0" max="100000000" step="1" required><div class="actions"><button id="save">Cadastrar produto</button><button type="button" id="cancel" class="secondary" hidden>Cancelar</button></div></form></section><section><h2>Catálogo de produtos</h2><input id="search" aria-label="Buscar produtos" placeholder="Buscar por nome ou categoria…"><div class="table"><table><thead><tr><th>PRODUTO</th><th>PREÇO</th><th>ESTOQUE</th><th>AÇÕES</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted">Carregando produtos…</p></section></div></main>
<script>
const $=id=>document.getElementById(id);let produtos=[],editing=null;const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function msg(t,error=false){$('message').textContent=t;$('message').className=error?'error':'';}
async function api(path='',options={}){const r=await fetch('/api/produtos'+path,{...options,headers:{'Content-Type':'application/json'}});const data=await r.json();if(!r.ok)throw Error(data.erro||'Erro na operação.');return data;}
function reset() {editing=null;$('form').reset();$('formTitle').textContent='Novo produto';$('save').textContent='Cadastrar produto';$('cancel').hidden=true;}
function render(){ $('total').textContent=produtos.length;$('units').textContent=produtos.reduce((a,p)=>a+p.quantidade,0);$('value').textContent=money(produtos.reduce((a,p)=>a+p.preco*p.quantidade,0));const q=$('search').value.toLocaleLowerCase('pt-BR');const list=produtos.filter(p=>(p.nome+' '+p.categoria).toLocaleLowerCase('pt-BR').includes(q));$('rows').replaceChildren();$('empty').hidden=list.length>0;$('empty').textContent=produtos.length?'Nenhum produto encontrado.':'Seu estoque está vazio. Cadastre o primeiro produto.';
for(const p of list){const row=document.createElement('tr');const name=document.createElement('td');const title=document.createElement('strong');title.textContent=p.nome;const cat=document.createElement('div');cat.className='muted';cat.textContent=p.categoria||'Sem categoria';name.append(title,cat);const price=document.createElement('td');price.textContent=money(p.preco);const qty=document.createElement('td');qty.textContent=p.quantidade;const actions=document.createElement('td');const edit=document.createElement('button');edit.className='secondary';edit.textContent='Editar';edit.onclick=()=>{editing=p.id;for(const key of ['nome','categoria','preco','quantidade'])$(key).value=p[key];$('formTitle').textContent='Editar produto';$('save').textContent='Salvar alterações';$('cancel').hidden=false;$('nome').focus();};const del=document.createElement('button');del.className='danger';del.textContent='Excluir';del.onclick=async()=>{if(!confirm('Excluir o produto “'+p.nome+'”?'))return;del.disabled=true;try{await api('/'+p.id,{method:'DELETE'});if(editing===p.id)reset();await load();msg('Produto excluído.');}catch(e){msg(e.message,true);del.disabled=false;}};actions.append(edit,del);row.append(name,price,qty,actions);$('rows').append(row);}}
async function load(){produtos=await api();render();}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const data={nome:$('nome').value.trim(),categoria:$('categoria').value.trim(),preco:Number($('preco').value),quantidade:Number($('quantidade').value)};await api(editing?'/'+editing:'',{method:editing?'PUT':'POST',body:JSON.stringify(data)});reset();await load();msg('Produto salvo com sucesso.');}catch(e){msg(e.message,true);}finally{$('save').disabled=false;}};
$('cancel').onclick=reset;$('search').oninput=render;load().catch(e=>{$('empty').textContent='Não foi possível carregar os produtos.';msg('Verifique se o servidor está iniciado. '+e.message,true);});
</script></html>
