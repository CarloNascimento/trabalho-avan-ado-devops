name: Deploy automático na VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: crud-produtos

    steps:
      - name: Baixar código atualizado
        uses: actions/checkout@v4

      - name: Verificar acesso ao Docker
        run: docker ps

      - name: Validar configuração
        run: docker compose -p estoque-crud config -q

      - name: Atualizar aplicação na VM
        run: docker compose -p estoque-crud up -d --build --wait

      - name: Conferir aplicação
        run: |
          docker compose -p estoque-crud ps
          curl --fail http://localhost:3000/health
